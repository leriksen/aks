pool:
  vmImage: ubuntu-latest

trigger:
  batch: true
  branches:
    include:
      - master
      - main
  paths:
    exclude:
      - applications/**/*
      - helm/**/*
      - modules/**/*
      - pipelines/**/*
      - scripts/**/*
      - terraform/**/*
    include:
      - applications/books

variables:
  major: 1
  minor: 0
  patch: 0
  buildId: $[counter(format('${0}.${1}', $(major), $(minor)), $(patch))]

stages:
  - stage: docker
    jobs:
      - job: docker
        workspace:
          clean: all
        steps:
          - task: Bash@3
            displayName: 'Update Build Number'
            inputs:
              targetType: 'inline'
              script: |
                # create new variable holding sum of the two numbers
                newBuildNumber=$(buildId)
  
                # display the sum
                echo "New Build Number: $newBuildNumber"
  
                # update the pipeline build number
                echo "##vso[build.updatebuildnumber]$newBuildNumber"
            condition: always()

          - task: Docker@2
            displayName: Login to hub.docker.com
            inputs:
              command: login
              containerRegistry: hub.docker.com

          - task: Docker@2
            displayName: Build and Push
            inputs:
              command: buildAndPush
              repository: books # username/contosoRepository for DockerHub
              buildContext: applications/books
              tags: |
                $(Build.BuildId)
                latest