pool:
  vmImage: ubuntu-latest

trigger:
  batch: true
  branches:
    include:
      - master
      - main
  paths:
    exclude:
      - applications/**/*
      - helm/**/*
      - modules/**/*
      - pipelines/**/*
      - scripts/**/*
      - terraform/**/*
    include:
      - applications/books

variables:
  - name: buildId
    value: $[counter('1.0', $variables['buildNumber'
stages:
  - stage: docker
    jobs:
      - job: docker
        workspace:
          clean: all
        steps:
          - task: Bash@3
            displayName: 'Update Build Number'
            inputs:
              targetType: 'inline'
              script: |
                # update the pipeline build number
                echo "##vso[build.updatebuildnumber]$(buildId)"
            condition: always()

          - task: Docker@2
            displayName: Login to hub.docker.com
            inputs:
              command: login
              containerRegistry: hub.docker.com

          - task: Docker@2
            displayName: Build and Push
            inputs:
              command: buildAndPush
              repository: books # username/contosoRepository for DockerHub
              buildContext: applications/books
              tags: |
                $(Build.BuildId)
                latest